<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="fraud-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#241026"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#fraud-bg)"/>

  <!-- Neural / Pipeline Nodes -->
  <g transform="translate(60, 190)">
    <!-- Node 1: Ingest -->
    <rect width="130" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Data Stream</text>
    <text x="65" y="52" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">10k tx/sec</text>

    <!-- Connector 1 -->
    <line x1="130" y1="35" x2="190" y2="35" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Node 2: LightGBM Model -->
    <g transform="translate(190, 0)">
      <rect width="150" height="70" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text x="75" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">LightGBM Model</text>
      <text x="75" y="52" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">&lt; 15ms Latency</text>
    </g>

    <!-- Connector 2 -->
    <line x1="340" y1="35" x2="400" y2="35" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Node 3: Fast API Gateway -->
    <g transform="translate(400, 0)">
      <rect width="140" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="70" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">FastAPI Gateway</text>
      <text x="70" y="52" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">Score &amp; Flag</text>
    </g>

    <!-- Connector 3 -->
    <line x1="540" y1="35" x2="600" y2="35" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Node 4: Evidently AI Drift -->
    <g transform="translate(600, 0)">
      <rect width="140" height="70" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="70" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Evidently AI</text>
      <text x="70" y="52" font-family="monospace" font-size="10" fill="#fb7185" text-anchor="middle">Drift Monitor</text>
    </g>
  </g>

  <!-- Top Metric Bar -->
  <g transform="translate(60, 50)">
    <rect width="680" height="75" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <text x="30" y="35" font-family="sans-serif" font-size="11" fill="#9ca3af">AUC-ROC SCORE</text>
    <text x="30" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#10b981">0.9942</text>

    <text x="210" y="35" font-family="sans-serif" font-size="11" fill="#9ca3af">INFERENCE TIME</text>
    <text x="210" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#38bdf8">11.8 ms</text>

    <text x="390" y="35" font-family="sans-serif" font-size="11" fill="#9ca3af">CONCEPT DRIFT GATE</text>
    <text x="390" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#10b981">STABLE (p=0.48)</text>

    <text x="560" y="35" font-family="sans-serif" font-size="11" fill="#9ca3af">CONTAINER</text>
    <text x="560" y="60" font-family="monospace" font-size="18" font-weight="700" fill="#c084fc">Docker Compose</text>
  </g>

  <!-- Bottom Terminal Log Preview -->
  <g transform="translate(60, 310)">
    <rect width="680" height="90" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
    <text x="25" y="28" font-family="monospace" font-size="11" fill="#10b981">$ python src/monitor.py --reference reference_data.pq --current inference_logs.db</text>
    <text x="25" y="50" font-family="monospace" font-size="11" fill="#9ca3af">[INFO] Evaluating Kolmogorov-Smirnov test across 28 numerical features...</text>
    <text x="25" y="72" font-family="monospace" font-size="11" fill="#38bdf8">[SUCCESS] Drift Gate Passed: 0 features drifted. Production alias healthy.</text>
  </g>
</svg>
