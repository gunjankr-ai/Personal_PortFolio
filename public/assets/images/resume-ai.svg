<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="resume-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="score-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#resume-bg)"/>

  <!-- Left: Resume Document Preview -->
  <g transform="translate(70, 50)">
    <rect width="260" height="350" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="30" width="120" height="14" rx="4" fill="#60a5fa"/>
    <rect x="25" y="55" width="210" height="8" rx="3" fill="#475569"/>
    <rect x="25" y="70" width="180" height="8" rx="3" fill="#475569"/>
    
    <line x1="25" y1="95" x2="235" y2="95" stroke="#334155" stroke-width="1"/>
    
    <rect x="25" y="115" width="90" height="10" rx="3" fill="#38bdf8"/>
    <rect x="25" y="135" width="200" height="6" rx="2" fill="#64748b"/>
    <rect x="25" y="148" width="170" height="6" rx="2" fill="#64748b"/>
    
    <rect x="25" y="175" width="80" height="10" rx="3" fill="#a78bfa"/>
    <rect x="25" y="195" width="190" height="6" rx="2" fill="#64748b"/>
    <rect x="25" y="208" width="150" height="6" rx="2" fill="#64748b"/>
    
    <!-- Verified Badge -->
    <g transform="translate(170, 260)">
      <rect width="70" height="26" rx="6" fill="#059669" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <text x="35" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">ATS 92%</text>
    </g>
  </g>

  <!-- Center Arrow / Scanning Beam -->
  <g transform="translate(355, 200)">
    <circle cx="25" cy="25" r="28" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M18 25 L32 25 M26 18 L33 25 L26 32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: 5-Factor Score & 8-Domain Breakdown -->
  <g transform="translate(430, 60)">
    <!-- Main Card -->
    <rect width="300" height="330" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">5-FACTOR FIT ANALYSIS</text>
    
    <!-- Score Factor 1 -->
    <text x="25" y="75" font-family="monospace" font-size="11" fill="#94a3b8">Tech Stack (35%)</text>
    <rect x="25" y="85" width="250" height="8" rx="4" fill="#1e293b"/>
    <rect x="25" y="85" width="230" height="8" rx="4" fill="url(#score-grad)"/>

    <!-- Score Factor 2 -->
    <text x="25" y="125" font-family="monospace" font-size="11" fill="#94a3b8">Experience &amp; Tenure (25%)</text>
    <rect x="25" y="135" width="250" height="8" rx="4" fill="#1e293b"/>
    <rect x="25" y="135" width="200" height="8" rx="4" fill="#38bdf8"/>

    <!-- Score Factor 3 -->
    <text x="25" y="175" font-family="monospace" font-size="11" fill="#94a3b8">Keywords &amp; Domain (15%)</text>
    <rect x="25" y="185" width="250" height="8" rx="4" fill="#1e293b"/>
    <rect x="25" y="185" width="220" height="8" rx="4" fill="#10b981"/>

    <!-- Score Factor 4 -->
    <text x="25" y="225" font-family="monospace" font-size="11" fill="#94a3b8">Tools &amp; Workflow (15%)</text>
    <rect x="25" y="235" width="250" height="8" rx="4" fill="#1e293b"/>
    <rect x="25" y="235" width="210" height="8" rx="4" fill="#818cf8"/>

    <!-- Pill Tags -->
    <g transform="translate(25, 275)">
      <rect width="105" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="52" y="17" font-family="sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">FastAPI + NLP</text>

      <rect x="115" width="135" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="182" y="17" font-family="sans-serif" font-size="10" fill="#c084fc" text-anchor="middle">Skill Gap Matrix</text>
    </g>
  </g>
</svg>
