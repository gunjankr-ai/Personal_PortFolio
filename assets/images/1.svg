<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="tech-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow-eff" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#bg-glow)"/>

  <!-- Futuristic Orbit Rings -->
  <circle cx="200" cy="200" r="185" stroke="url(#tech-accent)" stroke-width="1.5" stroke-dasharray="12 8" stroke-opacity="0.6"/>
  <circle cx="200" cy="200" r="165" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Neural Nodes in Background -->
  <g opacity="0.6">
    <circle cx="80" cy="140" r="3.5" fill="#06b6d4" filter="url(#glow-eff)"/>
    <circle cx="320" cy="130" r="3.5" fill="#10b981" filter="url(#glow-eff)"/>
    <circle cx="110" cy="280" r="2.5" fill="#3b82f6"/>
    <circle cx="290" cy="270" r="2.5" fill="#06b6d4"/>
    <line x1="80" y1="140" x2="130" y2="180" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4"/>
    <line x1="320" y1="130" x2="270" y2="170" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4"/>
  </g>

  <!-- Professional Portrait Silhouette -->
  <g>
    <!-- Shoulders & Torso -->
    <path d="M110 370 C110 295, 145 265, 200 265 C255 265, 290 295, 290 370 Z" fill="url(#silhouette)" stroke="url(#tech-accent)" stroke-width="1.5"/>
    <!-- Collar & Shirt Accents -->
    <path d="M175 265 L200 300 L225 265" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a"/>
    <path d="M200 300 L200 370" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Head -->
    <ellipse cx="200" cy="195" rx="50" ry="62" fill="url(#silhouette)" stroke="url(#tech-accent)" stroke-width="1.5"/>
    <!-- Modern Tech Hair Contour -->
    <path d="M150 185 C148 150, 165 130, 200 130 C235 130, 252 150, 250 185 C242 165, 225 155, 200 155 C175 155, 158 165, 150 185 Z" fill="#0f172a"/>
    <!-- Sleek Tech Glasses Frame (Subtle) -->
    <rect x="165" y="182" width="28" height="14" rx="4" stroke="#06b6d4" stroke-width="1.5" fill="#06b6d4" fill-opacity="0.1"/>
    <rect x="207" y="182" width="28" height="14" rx="4" stroke="#06b6d4" stroke-width="1.5" fill="#06b6d4" fill-opacity="0.1"/>
    <line x1="193" y1="189" x2="207" y2="189" stroke="#06b6d4" stroke-width="1.5"/>
  </g>

  <!-- Futuristic Corner Markers -->
  <path d="M45 75 L45 45 L75 45" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M355 75 L355 45 L325 45" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M45 325 L45 355 L75 355" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <path d="M355 325 L355 355 L325 355" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge at Bottom Center -->
  <g transform="translate(125, 335)">
    <rect width="150" height="28" rx="14" fill="#0b0f19" stroke="url(#tech-accent)" stroke-width="1.5"/>
    <circle cx="18" cy="14" r="4" fill="#10b981" filter="url(#glow-eff)"/>
    <text x="85" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">GUNJAN KUMAR</text>
  </g>
</svg>